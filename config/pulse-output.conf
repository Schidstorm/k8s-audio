context.properties = {
    core.name = "pulse-output"
}
pulse.properties = {
    server.dbus-name = "org.pulseaudio.Server.Output"
    server.address = [
        { address = "tcp:4713" client.access = "unrestricted" }
    ]
    pulse.allow-module-loading = false
}

pulse.rules = [
    {
        matches = [ { } ]
        actions = {
            quirks = [ block-record-stream ]
        }
    }
]