context.properties = {
    core.name = "pulse-input"
}

pulse.properties = {
    server.dbus-name = "org.pulseaudio.Server.Input"
    server.address = [
        { address = "tcp:4714" client.access = "unrestricted" }
    ]
    pulse.allow-module-loading = false
}

pulse.rules = [
    {
        matches = [ { } ]
        actions = {
            quirks = [ block-playback-stream ]
        }
    }
]